<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta name="theme-color" content="#173930" />
    <link rel="icon" href="./ski.png" />
    <title>再翻半圈 · 花式滑雪</title>
  </head>
  <body>
    <main id="app">
      <header>
        <span class="mark">◢◭</span>
        <div><b>再翻半圈</b></div>
        <div class="on-slope-menu">
          <button id="pause-ski" type="button" aria-label="暂停滑行">Ⅱ</button>
          <button id="menu" type="button" aria-label="打开雪场菜单">
            雪场
          </button>
        </div>
      </header>
      <section id="field" aria-label="雪道，按住收腿，松开展体">
        <div id="game"></div>
        <div id="hud">
          <div>
            <small id="mode"></small>
            <h1 id="line"></h1>
          </div>
          <div class="points">
            <small id="score-label">线路得分</small
            ><strong id="score">0000</strong>
          </div>
        </div>
        <div id="feedback"></div>
        <aside id="duel" hidden>
          <strong id="duel-gap"></strong>
          <small id="duel-rank"></small>
        </aside>
        <div id="trick"></div>
        <div id="meter"></div>
        <div
          id="grab-choices"
          role="group"
          aria-label="选择抓板动作"
          hidden
        ></div>
      </section>
      <footer>
        <div class="strip">
          <span id="jump"></span><span id="progress"></span>
        </div>
        <div id="freestyle-controls">
          <div id="speed-row">
            <output id="speed"></output>
            <div class="pedals">
              <button
                id="grab-toggle"
                type="button"
                aria-expanded="false"
                aria-controls="grab-choices"
              >
                动作</button
              ><button id="brake" type="button" aria-pressed="false">
                压刃</button
              ><button id="boost" type="button">冲刺</button>
            </div>
          </div>
        </div>
        <button id="ride">
          <span class="disc">↗</span
          ><span><strong id="action"></strong><small id="hint"></small></span
          ><i>›</i>
        </button>
      </footer>
      <aside id="rotate-screen" aria-labelledby="rotate-title" hidden>
        <div class="rotate-device" aria-hidden="true"></div>
        <h2 id="rotate-title">横过手机，继续滑行</h2>
        <p>横屏可以同时看清旗门、跳台和落坡。</p>
      </aside>
      <section id="screen" aria-labelledby="screen-title" hidden>
        <section id="panel"></section>
      </section>
      <dialog id="sheet" aria-labelledby="overlay-title">
        <section id="overlay-panel"></section>
      </dialog>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
